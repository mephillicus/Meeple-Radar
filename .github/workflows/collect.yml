name: collect

on:
  schedule:
    - cron: "0 6 * * 2,4,6"
  workflow_dispatch: {}

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Restore BGG skipped cache
        uses: actions/cache@v6
        with:
          path: collector/data/bgg-online-skipped.json
          key: bgg-skipped-${{ github.run_id }}
          restore-keys: |
            bgg-skipped-
      - name: Show environment
        run: |
          node -v
          npm -v
          echo "commit=$GITHUB_SHA"
      - run: npm ci
      - name: Download BGG ranks CSV
        run: |
          mkdir -p data
          curl -fsSL -o data/boardgames_ranks.csv ${{ secrets.BGG_RANKS_CSV_URL }}
      - run: npm run collect
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          HEALTH_WEBHOOK_URL: ${{ secrets.HEALTH_WEBHOOK_URL }}
          BGG_API_TOKEN: ${{ secrets.BGG_API_TOKEN }}

  collection-sync:
    needs: collect
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run collect:collection
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BGG_USERNAME: ${{ secrets.BGG_USERNAME }}
          BGG_API_TOKEN: ${{ secrets.BGG_API_TOKEN }}
